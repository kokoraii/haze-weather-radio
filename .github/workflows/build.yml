# Every push to a branch other than main: run the tests and build the bundles.
# The two are independent, so a failing test still leaves downloadable artifacts.
# This also covers Dependabot's auto/ branches. Main has its own workflow so that
# its run number counts main pushes only.
#
# No concurrency group: cancelling superseded runs would break "every push builds".
name: Build

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/reusable-tests.yml

  bundles:
    uses: ./.github/workflows/reusable-bundles.yml
