version: v2
managed:
  enabled: false
plugins:
  # Generator versions are pinned here. The generated Go code is committed so
  # builds on every platform, including the FreeBSD VM and Windows CLANG64, do
  # not need protoc or buf. Regenerate with scripts/gen-proto.sh.
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5]
    out: services/go/internal/gen
    opt: paths=source_relative
  - local: [go, run, google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1]
    out: services/go/internal/gen
    opt: paths=source_relative
