[package]
name = "haze-netalert"
description = "Network alert WebSocket service (CAP/JSON with Ogg/Opus audio), on-air banner state, and the legacy EAS NET bridge"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "haze-netalert"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytes = "1.12.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3.34"
haze-bridge-client = { path = "../haze-bridge-client" }
haze-cap = { path = "../haze-cap" }
ogg = "0.9.2"
opus = "0.4.0"
quick-xml = { version = "0.38", features = ["serialize"] }
russh = "0.62.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
