[package]
name = "haze-contracts"
description = "Rust types and gRPC stubs generated from the Haze protobuf contracts"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
build = "build.rs"

[dependencies]
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport"] }
tonic-prost = "0.14"

[build-dependencies]
protox = "0.10"
tonic-prost-build = { version = "0.14", default-features = false }
